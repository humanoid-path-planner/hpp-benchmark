format = "hpp-problem/0.1"
name = "pr2-manipulation-two-hand-spf"
description = """\
PR2 with a locked base turns a box over on a kitchen table, regrasping it with both hands (as \
script.py)."""

[[robots]]
name = "pr2"
urdf = "package://example-robot-data/robots/pr2_description/urdf/pr2.urdf"
srdf = "package://example-robot-data/robots/pr2_description/srdf/pr2_manipulation.srdf"
root_joint = "planar"

[[robots]]
name = "box"
urdf = "package://hpp_benchmark/urdf/pr2-manipulation-kitchen/box.urdf"
srdf = "package://hpp_benchmark/srdf/pr2-manipulation-kitchen/box.srdf"
root_joint = "freeflyer"

[[robots]]
name = "kitchen_area"
urdf = "package://hpp_tutorial/urdf/kitchen_area_obstacle.urdf"
srdf = "package://hpp_tutorial/srdf/kitchen_area.srdf"
root_joint = "anchor"

[joint_bounds]
"pr2/root_joint" = [-5, -2, -5.2, -2.7]
"box/root_joint" = [-5.1, -2, -5.2, -2.7, 0, 1.5]

[constraints]
l_l_finger = {type = "locked_joint", joint = "pr2/l_gripper_l_finger_joint", value = [0.5]}
l_r_finger = {type = "locked_joint", joint = "pr2/l_gripper_r_finger_joint", value = [0.5]}
r_l_finger = {type = "locked_joint", joint = "pr2/r_gripper_l_finger_joint", value = [0.5]}
r_r_finger = {type = "locked_joint", joint = "pr2/r_gripper_r_finger_joint", value = [0.5]}
head_pan = {type = "locked_joint", joint = "pr2/head_pan_joint", value = [0]}
head_tilt = {type = "locked_joint", joint = "pr2/head_tilt_joint", value = [0]}
torso = {type = "locked_joint", joint = "pr2/torso_lift_joint", value = [0.2]}
laser = {type = "locked_joint", joint = "pr2/laser_tilt_mount_joint", value = [0]}
lockplanar = {type = "locked_joint", joint = "pr2/root_joint", value = [-3.2, -4, 1, 0]}

[graph]
name = "graph"
error_threshold = 0.001
max_iterations = 40
grippers = ["pr2/l_gripper", "pr2/r_gripper"]
environment_contacts = ["kitchen_area/pancake_table_table_top"]
objects = [{name = "box", handles = ["box/handle", "box/handle2"], contacts = ["box/box_surface"]}]
rules = [{grippers = [""], handles = [""], link = true}]

[graph.add]
graph = [
  "r_l_finger", "r_r_finger", "l_l_finger", "l_r_finger", "head_pan", "head_tilt", "torso",
  "laser", "lockplanar",
]

[problem]
steering_method = "Straight"
path_validation = {type = "Dichotomy", tolerance = 0}
path_projector = {type = "Progressive", step = 0.2}
config_validations = ["CollisionValidation"]

# Base at (-3.2, -4), torso 0.2, fingers 0.5; box on the table, turned over in the goal.
[init]
project_on = "free"

[init.joints]
"pr2/root_joint" = [-3.2, -4, 1, 0]
"pr2/torso_lift_joint" = 0.2
"pr2/l_gripper_l_finger_joint" = 0.5
"pr2/l_gripper_r_finger_joint" = 0.5
"pr2/r_gripper_l_finger_joint" = 0.5
"pr2/r_gripper_r_finger_joint" = 0.5
"box/root_joint" = [-2.5, -3.6, 0.76, 0, 0.7071067811865476, 0, 0.7071067811865476]

[goal]
project_on = "free"

[goal.joints]
"pr2/root_joint" = [-3.2, -4, 1, 0]
"pr2/torso_lift_joint" = 0.2
"pr2/l_gripper_l_finger_joint" = 0.5
"pr2/l_gripper_r_finger_joint" = 0.5
"pr2/r_gripper_l_finger_joint" = 0.5
"pr2/r_gripper_r_finger_joint" = 0.5
"box/root_joint" = [-2.5, -4.4, 0.76, 0, -0.7071067811865476, 0, 0.7071067811865476]

[planner]
type = "StatesPathFinder"
max_iterations = 5000

[planner.parameters]
"StatesPathFinder/innerPlannerTimeOut" = 0.0
"StatesPathFinder/innerPlannerMaxIterations" = 100
"StatesPathFinder/nTriesUntilBacktrack" = 3
