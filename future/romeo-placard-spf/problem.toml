format = "hpp-problem/0.1"
name = "romeo-placard-spf"
description = """\
Romeo, standing in static balance, turns a placard held with one hand by regrasping it with both \
(as script.py)."""

[[robots]]
name = "romeo"
urdf = "package://example-robot-data/robots/romeo_description/urdf/romeo.urdf"
srdf = "package://example-robot-data/robots/romeo_description/srdf/romeo_moveit.srdf"
root_joint = "freeflyer"

[[robots]]
name = "placard"
urdf = "package://hpp_environments/urdf/placard.urdf"
srdf = "package://hpp_environments/srdf/placard.srdf"
root_joint = "freeflyer"

[joint_bounds]
"romeo/root_joint" = [-1, 1, -1, 1, 0, 2, -2, 2, -2, 2, -2, 2, -2, 2]
"placard/root_joint" = [-1, 1, -1, 1, 0, 1.5, -2, 2, -2, 2, -2, 2, -2, 2]

[partial_coms]
romeo = ["romeo/root_joint"]

[constraints]
"romeo/LHand" = {type = "locked_joint", joint = "romeo/LHand", value = [1]}
"romeo/LFinger12" = {type = "locked_joint", joint = "romeo/LFinger12", value = [1.06]}
"romeo/LFinger13" = {type = "locked_joint", joint = "romeo/LFinger13", value = [1.06]}
"romeo/LFinger21" = {type = "locked_joint", joint = "romeo/LFinger21", value = [1.06]}
"romeo/LFinger22" = {type = "locked_joint", joint = "romeo/LFinger22", value = [1.06]}
"romeo/LFinger23" = {type = "locked_joint", joint = "romeo/LFinger23", value = [1.06]}
"romeo/LFinger31" = {type = "locked_joint", joint = "romeo/LFinger31", value = [1.06]}
"romeo/LFinger32" = {type = "locked_joint", joint = "romeo/LFinger32", value = [1.06]}
"romeo/LFinger33" = {type = "locked_joint", joint = "romeo/LFinger33", value = [1.06]}
"romeo/LThumb1" = {type = "locked_joint", joint = "romeo/LThumb1", value = [0]}
"romeo/LThumb2" = {type = "locked_joint", joint = "romeo/LThumb2", value = [1.06]}
"romeo/LThumb3" = {type = "locked_joint", joint = "romeo/LThumb3", value = [1.06]}
"romeo/RHand" = {type = "locked_joint", joint = "romeo/RHand", value = [1]}
"romeo/RFinger12" = {type = "locked_joint", joint = "romeo/RFinger12", value = [1.06]}
"romeo/RFinger13" = {type = "locked_joint", joint = "romeo/RFinger13", value = [1.06]}
"romeo/RFinger21" = {type = "locked_joint", joint = "romeo/RFinger21", value = [1.06]}
"romeo/RFinger22" = {type = "locked_joint", joint = "romeo/RFinger22", value = [1.06]}
"romeo/RFinger23" = {type = "locked_joint", joint = "romeo/RFinger23", value = [1.06]}
"romeo/RFinger31" = {type = "locked_joint", joint = "romeo/RFinger31", value = [1.06]}
"romeo/RFinger32" = {type = "locked_joint", joint = "romeo/RFinger32", value = [1.06]}
"romeo/RFinger33" = {type = "locked_joint", joint = "romeo/RFinger33", value = [1.06]}
"romeo/RThumb1" = {type = "locked_joint", joint = "romeo/RThumb1", value = [0]}
"romeo/RThumb2" = {type = "locked_joint", joint = "romeo/RThumb2", value = [1.06]}
"romeo/RThumb3" = {type = "locked_joint", joint = "romeo/RThumb3", value = [1.06]}

[constraints.balance]
type = "static_stability"
com = "romeo"
left_ankle = "romeo/LAnkleRoll"
right_ankle = "romeo/RAnkleRoll"
# Reference configuration: romeo neutral, placard at (0.4, 0, 1.2).
config = {joints = {"placard/root_joint" = [0.4, 0, 1.2, 0, 0, 0, 1]}}

[graph]
name = "graph"
error_threshold = 0.0002
max_iterations = 40
grippers = ["romeo/r_hand", "romeo/l_hand"]
objects = [{name = "placard", handles = ["placard/low", "placard/high"], contacts = []}]

[[graph.rules]]
grippers = ["romeo/l_hand", "romeo/r_hand"]
handles = ["placard/low", ""]
link = true

[[graph.rules]]
grippers = ["romeo/l_hand", "romeo/r_hand"]
handles = ["", "placard/high"]
link = true

[[graph.rules]]
grippers = ["romeo/l_hand", "romeo/r_hand"]
handles = ["placard/low", "placard/high"]
link = true

[graph.add]
graph = [
  "romeo/LHand", "romeo/LFinger12", "romeo/LFinger13", "romeo/LFinger21", "romeo/LFinger22",
  "romeo/LFinger23", "romeo/LFinger31", "romeo/LFinger32", "romeo/LFinger33", "romeo/LThumb1",
  "romeo/LThumb2", "romeo/LThumb3", "romeo/RHand", "romeo/RFinger12", "romeo/RFinger13",
  "romeo/RFinger21", "romeo/RFinger22", "romeo/RFinger23", "romeo/RFinger31", "romeo/RFinger32",
  "romeo/RFinger33", "romeo/RThumb1", "romeo/RThumb2", "romeo/RThumb3", "balance/pose-left-foot",
  "balance/pose-right-foot", "balance/relative-com",
]

[problem]
steering_method = "Straight"
path_validation = {type = "Dichotomy", tolerance = 0}
path_projector = {type = "Progressive", step = 0.05}
config_validations = ["CollisionValidation"]

# Standing posture, placard held by the left hand at its low handle; the goal
# turns it by pi about z.
[init]
project_on = "romeo/l_hand grasps placard/low"

[init.joints]
"romeo/root_joint" = [
