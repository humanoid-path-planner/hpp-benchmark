"pyrene/arm_right_3_joint" = 0.0002
"pyrene/arm_right_4_joint" = -0.525366
"pyrene/arm_right_7_joint" = 0.1

[constraints."locked_pyrene/torso_2_joint"]
type = "locked_joint"
joint = "pyrene/torso_2_joint"
value = [0.006761]

[problem]
steering_method = "Straight"
path_validation = {type = "Dichotomy", tolerance = 0}
path_projector = {type = "Progressive", step = 0.2}
config_validations = ["CollisionValidation"]

[problem.config_projector]
name = "balance-proj"
# The script drops balance/pose-left-foot-complement.
constraints = [
  "balance/relative-com", "balance/relative-pose", "balance/pose-left-foot",
  "locked_pyrene/torso_1_joint", "locked_pyrene/torso_2_joint",
]

[init]
project = true

